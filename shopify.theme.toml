# shopify.theme.toml
[environments.local]            # usato da `shopify theme dev`
store = "bolter-development.myshopify.com"
# nessun theme: la CLI usa un tema "development" personale e nascosto

[environments.development]      # tema condiviso: riceve solo build
store = "bolter-development.myshopify.com"
# theme = "<ID del tema di sviluppo condiviso>"   (da `shopify theme list`)

[environments.production]
store = "bolter-development.myshopify.com"
# theme = "<ID del tema di produzione>"           (da `shopify theme list`)
ignore = ["config/settings_data.json"]
